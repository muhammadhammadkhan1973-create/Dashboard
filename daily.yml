name: Daily Dashboard Scan

on:
  schedule:
    # 6:00 AM Dubai = 02:00 UTC (Dubai is UTC+4)
    - cron: '0 2 * * *'
    # 6:00 PM Dubai = 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance fredapi requests beautifulsoup4 feedparser lxml pandas numpy

      - name: Run scanner
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scanner.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
