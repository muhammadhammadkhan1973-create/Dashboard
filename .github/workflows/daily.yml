name: Daily Dashboard Scan

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 Dubai (UTC+4)
    - cron: '0 14 * * *'  # 18:00 Dubai (UTC+4)
  workflow_dispatch:
    inputs:
      force_im3:
        description: 'Force a full IM3 re-score (re-scores all current explosive / TCE-HIGH tickers even if the list is unchanged)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          # CI OVERHEAD FIX (2026-07-15). The owner's workflow reads ~7m07s while the SCANNER
          # itself is 5m37s (meta.runtime_sec) -- the ~90s gap is checkout/pip/im3/commit, NOT
          # scanner code. This step was re-downloading and re-building EIGHT packages (pandas +
          # yfinance are the expensive ones) on EVERY run because pip caching was never switched
          # on. setup-python has it built in; it keys the cache off the dependency file below.
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compute scanner inputs hash (skip-guard)
        id: inputs_hash
        run: |
          python3 << 'EOF'
          import hashlib, os, json, datetime
          # Hash the scanner code + every config/data INPUT the scanner reads. If none of
          # these changed AND this is a manual re-run AND a valid data.json already exists,
          # the expensive scanner run is skipped (identical output guaranteed). Scheduled
          # (cron) runs ALWAYS execute — live market data moves regardless of input hashes.
          FILES = ['scanner.py', 'live_portfolio.json', 'psx_financials.json',
                   'psx_macros_manual.json', 'bank_ig2_inputs.json', 'bank_ig2_overrides.json',
                   'ETF_Universe.xlsx', 'GICS_Breakdown_For_US_Market_Only.xlsx',
                   'm1_force_rescore.json']
          h = hashlib.sha256()
          for fn in FILES:
              try:
                  with open(fn, 'rb') as f: h.update(f.read())
              except Exception: h.update(b'\x00')  # missing file is part of the state
          cur = h.hexdigest()
          try:    prev = open('.scanner_inputs_hash').read().strip()
          except Exception: prev = ''
          inputs_unchanged = bool(cur) and cur == prev
          # data.json must already exist, be valid JSON, AND still be FRESH to safely skip.
          # FRESHNESS GUARD: input hashes only cover CONFIG. Live market data moves even when
          # no input file changed, so a stale data.json must always trigger a real scan --
          # this is why a manual re-run previously needed the "force" tick just to get fresh
          # prices. We read the scan time from INSIDE data.json (meta.last_scan_utc): the file
          # mtime is useless here because git checkout rewrites it to the checkout time.
          MAX_AGE_MIN = 90
          data_ok = False
          try:
              with open('data.json') as f: _dj = json.load(f)
              _ts = ((_dj.get('meta') or {}).get('last_scan_utc') or '').replace('Z', '+00:00')
              _age = (datetime.datetime.now(datetime.timezone.utc)
                      - datetime.datetime.fromisoformat(_ts)).total_seconds() / 60.0
              data_ok = _age < MAX_AGE_MIN
              print(f"data.json age={_age:.0f} min (limit {MAX_AGE_MIN}) -> fresh={data_ok}")
          except Exception as _e:
              print(f"data.json freshness check failed ({_e}) -> treating as STALE (will scan)")
              data_ok = False
          is_manual = os.environ.get('GITHUB_EVENT_NAME', '') == 'workflow_dispatch'
          forced = str(os.environ.get('FORCE_IM3', '')).lower() == 'true'
          # Skip ONLY on a manual, unforced re-run with unchanged inputs and a good data.json.
          skip = bool(is_manual and inputs_unchanged and data_ok and not forced)
          print(f"inputs_unchanged={inputs_unchanged} (cur {cur[:8]} vs prev {prev[:8]})")
          print(f"is_manual={is_manual} data_ok={data_ok} forced={forced} -> skip_scanner={skip}")
          # Always write the current hash so the NEXT run compares against this state.
          try: open('.scanner_inputs_hash', 'w').write(cur)
          except Exception: pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"skip_scanner={'true' if skip else 'false'}\n")
          EOF
        env:
          FORCE_IM3: ${{ github.event.inputs.force_im3 }}

      - name: Run scanner
        if: steps.inputs_hash.outputs.skip_scanner != 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ETF_NINJA_KEY: ${{ secrets.ETF_NINJA_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ETF_FINNHUB_KEY: ${{ secrets.ETF_FINNHUB_KEY }}
        run: python scanner.py

      - name: Scanner skipped (inputs unchanged)
        if: steps.inputs_hash.outputs.skip_scanner == 'true'
        run: echo "Scanner skipped — manual re-run with unchanged inputs and a valid data.json already present. IM3 steps below still run against the existing data.json."

      - name: Check if explosive list changed
        id: check_explosive
        run: |
          python3 << 'EOF'
          import json, os

          # Read new explosive list from data.json
          with open('data.json') as f:
              data = json.load(f)

          # Explosive both-signal tickers
          explosive = sorted([
              r['ticker'] for r in data.get('explosive_us', [])
              if r.get('verdict', '').startswith('EXPLOSIVE')
          ])
          # TCE HIGH tickers (US only)
          tce_high = sorted([
              r['ticker'] for r in data.get('tce_us', [])
              if r.get('tier') == 'HIGH'
          ])
          # Financial both-signal tickers — flagged "FINANCIAL — score via bank model"
          # (their EXPLOSIVE verdict is overwritten in scanner.py), so they must be added
          # explicitly or they never reach im3_score.py (they would sit "Pending" forever).
          financial = sorted([
              r['ticker'] for r in data.get('explosive_us', [])
              if r.get('verdict', '').startswith('FINANCIAL')
          ])
          # Watchlist verdicts (P3 widen): QUALITY-GROWTH + INFLECTION — the names you
          # might actually act on. NOT-EXPLOSIVE stays unscored.
          watchlist = sorted([
              r['ticker'] for r in data.get('explosive_us', [])
              if r.get('verdict', '').startswith('QUALITY-GROWTH')
              or r.get('verdict', '').startswith('INFLECTION')
              # v1.298 pair (owner: 'except dell no other stock is im scored'): the new
              # TURNAROUND tier is a first-class verdict -- 22 names carrying Signal Q +
              # Signal T were rendering with a blank IM3 cell because this collection is
              # verdict-based and the tier did not exist when it was written.
              or r.get('verdict', '').startswith('TURNAROUND')
          ])
          # ZACKS DISCOVERY names (owner 2026-07-21: 'all zacks 1 and 2 should be im scored
          # as well'): the pink tier -- outside-screen radar rows + screened NOT-EXPLOSIVE
          # names stamped zacks_discovery -- joins the scoring set. ~60 names one-time,
          # then incremental (only new/missing thereafter).
          # v1.299 CROSS-TAB SCORING (owner-approved 'scored-everywhere' pass): the 13F whale
          # top-holdings and the Wave-Z double-confirmed consensus names were displayed on
          # Tabs 2/9 with BLANK quality -- the dashboard scored 190 names the owner does not
          # own and none of the ones smart money actually holds. Both sets now join the IM3
          # universe (~54 net new names, one heavier pass, then incremental).
          # v1.302 OWNER PORTFOLIO (audit gap #1): the engine scored 350 names the owner does
          # NOT own while XOM, COP, EOG, UNH and GIS carried no grade anywhere -- a dashboard
          # that cannot answer 'is what I own any good?'. The live portfolio is now a
          # first-class member of the IM3 universe. PSX names ride the PSX scoring step.
          owner_us  = ['XOM', 'CVX', 'COP', 'EOG', 'GOOGL', 'MSFT', 'META', 'UNH', 'GIS', 'KO']
          owner_psx = ['OGDC', 'PPL', 'MCB', 'FFC', 'HUBC']
          smart = list(owner_us)
          for _w13 in ((data.get('whale_13f') or {}).get('whales') or []):
              for _h13 in (_w13.get('top_holdings') or []):
                  if _h13.get('ticker'):
                      smart.append(_h13['ticker'])
          smart += [s.get('ticker') for s in ((data.get('inst_consensus') or {}).get('stocks') or [])
                    if s.get('ticker')]
          smart = sorted({str(t).upper().split(':')[-1] for t in smart if t})
          zdisc = sorted(set(
              [r['ticker'] for r in (data.get('zacks_radar') or {}).get('rows', [])
               if r.get('ticker')]
              + [r['ticker'] for r in data.get('explosive_us', [])
                 if r.get('zacks_discovery') and r.get('ticker')]
          ))
          # Combined — score explosives, banks (System B), TCE-HIGH, watchlist, and discoveries
          new_tickers = sorted(set(explosive + financial + tce_high + watchlist + zdisc + smart + owner_us))

          # Read previous list (stored in data.json from last run)
          prev_tickers = sorted(data.get('im3_explosive_tickers', []))

          names_changed = new_tickers != prev_tickers

          # Self-heal: also re-score if any current explosive / TCE-HIGH ticker
          # is MISSING its im3 score (e.g. after a data.json state loss / restore).
          def _has_im3(records, tk):
              for r in records:
                  if r.get('ticker') == tk:
                      v = r.get('im3')
                      # v1.277.2 pair: a stale_ver-marked grade is kept for DISPLAY (keep-last-good)
                      # but counts as MISSING here so the self-heal re-scores it promptly.
                      return isinstance(v, dict) and len(v) > 0 and not v.get('stale_ver')
              return False

          ex_recs  = data.get('explosive_us', [])
          zr_recs  = (data.get('zacks_radar') or {}).get('rows', [])
          tce_recs = data.get('tce_us', [])
          missing_im3 = [
              t for t in new_tickers
              if not (_has_im3(ex_recs, t) or _has_im3(tce_recs, t) or _has_im3(zr_recs, t))
          ]
          needs_heal = bool(missing_im3)

          # Scorer-version auto-force: if im3_score.py itself changed since the last
          # successful score, re-score even when the ticker set is unchanged (so a
          # scorer upgrade like System B propagates automatically — no manual checkbox).
          import hashlib
          # Hash the scorer + the CURATED bank input only, so editing im3_score.py or
          # bank_ig2_inputs.json forces a re-score. bank_ig2_overrides.json is DELIBERATELY
          # EXCLUDED: the scanner regenerates it fresh every run (FDIC fill-missing), so its
          # bytes shift run-to-run and including it flipped this hash on nearly every run ->
          # a full 255-name re-score every run (the ~5min workflow overhead). The 14-day
          # MAX_AGE clock still forces a periodic full re-score to catch any bank-override drift.
          try:
              _h = hashlib.sha256()
              _h.update(open('im3_score.py','rb').read())
              for _bf in ('bank_ig2_inputs.json',):
                  try: _h.update(open(_bf,'rb').read())
                  except Exception: pass
              cur_hash = _h.hexdigest()
          except Exception: cur_hash = ''
          # v1.283.1 ROOT-CAUSE FIX (proven by artifact comparison): the committed
          # .im3_scorer_hash (76a22639...) matched NO computable current state -- it was
          # written when bank_ig2_overrides.json still existed, and the per-run rewrites
          # never landed in the repo. Result: scorer_changed fired EVERY run -> perpetual
          # full 190-name re-scores (the stamp mystery AND a chunk of the original 9-minute
          # jobs; the incremental logic never operated). The hash state now lives INSIDE
          # data.json -- written by the same json.dump that demonstrably persists every
          # run -- with the file kept only as a first-boot fallback.
          prev_hash = str(data.get('im3_scorer_hash') or '')
          if not prev_hash:
              try:    prev_hash = open('.im3_scorer_hash').read().strip()
              except Exception: prev_hash = ''
          scorer_changed = bool(cur_hash) and cur_hash != prev_hash
          print(f"Scorer changed: {scorer_changed} (cur {cur_hash[:8]} vs prev {prev_hash[:8]})")

          # Max-age (P4): re-score every 14 days even if nothing changed — a staleness
          # ceiling so grades never drift stale (standard freshness-vs-compute cache rule).
          from datetime import datetime, timezone
          MAX_AGE_DAYS = 14
          stale = True
          _last = data.get('im3_last_scored_utc')
          if _last:
              try:
                  _dt = datetime.fromisoformat(str(_last).replace('Z', '+00:00'))
                  stale = (datetime.now(timezone.utc) - _dt).days >= MAX_AGE_DAYS
              except Exception:
                  stale = True

          # INCREMENTAL SCORING (owner: the Actions job ran 9+ min while the scanner took
          # ~5 -- the delta was THIS pipeline re-scoring ALL ~128 names whenever the ticker
          # SET changed at all, though membership shifts a little every run. A membership
          # change with every grade present needs NOTHING scored. Now:
          #   full re-score  = scorer/bank-input hash changed OR 14-day ceiling OR force
          #   incremental    = ONLY missing_im3 (no current-ver grade, or stale_ver-marked)
          #   names_changed alone no longer triggers anything (nothing to compute).
          full_rescore = scorer_changed or stale
          full_reason = ('scorer-changed' if scorer_changed else 'stale-clock' if stale else '')
          score_tickers = new_tickers if full_rescore else missing_im3
          changed = full_rescore or bool(missing_im3)
          print(f"Stale (>{MAX_AGE_DAYS}d): {stale} (last scored {_last})")
          print(f"Previous:      {prev_tickers}")
          print(f"New:           {new_tickers}")
          print(f"Names changed: {names_changed} (informational only -- no longer a trigger)")
          print(f"Missing im3:   {missing_im3}")
          print(f"Full re-score: {full_rescore} | to score: {len(score_tickers)} of {len(new_tickers)}")
          print(f"Changed:       {changed}")

          # Write output for next step
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
              f.write(f"tickers={' '.join(new_tickers)}\n")
              f.write(f"score_tickers={' '.join(score_tickers)}\n")
              f.write(f"full_rescore={'true' if full_rescore else 'false'}\n")
              f.write(f"full_reason={full_reason}\n")
          EOF

      - name: Score explosive stocks with IM3
        # Runs when the explosive/TCE-HIGH set changed OR a score is missing (self-heal),
        # OR when manually forced via the "force_im3" Run-workflow toggle. The force path
        # re-scores the CURRENT set with the live im3_score.py (e.g. after a scorer change),
        # without any hand-edit of data.json.
        # v-fix: ALSO run on every manual dispatch -- the change/force gate silently skipped this step
        # on manual runs (incl. restoration attempts), leaving no trace and no way to heal. Manual runs
        # now always enter; the step's own incremental logic keeps unneeded runs cheap.
        # v-fix2: run on SCHEDULED runs too -- a quiet cron evening previously skipped this step, wrote a
        # data.json without the workflow-side keys (im3_detail among them, -1.1MB observed live), and forced
        # the next run into a self-heal full re-score: a drop-then-rebuild thrash cycle. The step's own
        # incremental logic keeps quiet runs cheap (~1-2 min); state continuity is worth that always.
        if: steps.check_explosive.outputs.changed == 'true' || github.event.inputs.force_im3 == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          SCORE_TICKERS: ${{ steps.check_explosive.outputs.score_tickers }}
          FULL_RESCORE: ${{ steps.check_explosive.outputs.full_rescore }}
          FULL_REASON: ${{ steps.check_explosive.outputs.full_reason }}
        run: |
          python3 << 'EOF'
          import json, subprocess, sys

          with open('data.json') as f:
              data = json.load(f)

          # Explosive both-signal tickers
          explosive = [
              r['ticker'] for r in data.get('explosive_us', [])
              if r.get('verdict', '').startswith('EXPLOSIVE')
          ]
          # TCE HIGH tickers (US only)
          tce_high = [
              r['ticker'] for r in data.get('tce_us', [])
              if r.get('tier') == 'HIGH'
          ]
          # Financial both-signal tickers — scored via the bank model (IM3 System B).
          # MUST be included here: scanner.py overwrites their EXPLOSIVE verdict with
          # "FINANCIAL — score via bank model", so a startswith('EXPLOSIVE') filter alone
          # would leave every bank unscored ("Pending next scan").
          financial = [
              r['ticker'] for r in data.get('explosive_us', [])
              if r.get('verdict', '').startswith('FINANCIAL')
          ]
          # Watchlist verdicts (P3 widen): QUALITY-GROWTH + INFLECTION. NOT-EXPLOSIVE skipped.
          watchlist = sorted([
              r['ticker'] for r in data.get('explosive_us', [])
              if r.get('verdict', '').startswith('QUALITY-GROWTH')
              or r.get('verdict', '').startswith('INFLECTION')
              # v1.298 pair (owner: 'except dell no other stock is im scored'): the new
              # TURNAROUND tier is a first-class verdict -- 22 names carrying Signal Q +
              # Signal T were rendering with a blank IM3 cell because this collection is
              # verdict-based and the tier did not exist when it was written.
              or r.get('verdict', '').startswith('TURNAROUND')
          ])
          # ZACKS DISCOVERY names (owner 2026-07-21: 'all zacks 1 and 2 should be im scored
          # as well'): the pink tier -- outside-screen radar rows + screened NOT-EXPLOSIVE
          # names stamped zacks_discovery -- joins the scoring set. ~60 names one-time,
          # then incremental (only new/missing thereafter).
          # v1.299 CROSS-TAB SCORING (owner-approved 'scored-everywhere' pass): the 13F whale
          # top-holdings and the Wave-Z double-confirmed consensus names were displayed on
          # Tabs 2/9 with BLANK quality -- the dashboard scored 190 names the owner does not
          # own and none of the ones smart money actually holds. Both sets now join the IM3
          # universe (~54 net new names, one heavier pass, then incremental).
          # v1.302 OWNER PORTFOLIO (audit gap #1): the engine scored 350 names the owner does
          # NOT own while XOM, COP, EOG, UNH and GIS carried no grade anywhere -- a dashboard
          # that cannot answer 'is what I own any good?'. The live portfolio is now a
          # first-class member of the IM3 universe. PSX names ride the PSX scoring step.
          owner_us  = ['XOM', 'CVX', 'COP', 'EOG', 'GOOGL', 'MSFT', 'META', 'UNH', 'GIS', 'KO']
          owner_psx = ['OGDC', 'PPL', 'MCB', 'FFC', 'HUBC']
          smart = list(owner_us)
          for _w13 in ((data.get('whale_13f') or {}).get('whales') or []):
              for _h13 in (_w13.get('top_holdings') or []):
                  if _h13.get('ticker'):
                      smart.append(_h13['ticker'])
          smart += [s.get('ticker') for s in ((data.get('inst_consensus') or {}).get('stocks') or [])
                    if s.get('ticker')]
          smart = sorted({str(t).upper().split(':')[-1] for t in smart if t})
          zdisc = sorted(set(
              [r['ticker'] for r in (data.get('zacks_radar') or {}).get('rows', [])
               if r.get('ticker')]
              + [r['ticker'] for r in data.get('explosive_us', [])
                 if r.get('zacks_discovery') and r.get('ticker')]
          ))
          explosive_tickers = sorted(set(explosive + financial + tce_high + watchlist + zdisc + smart + owner_us))

          if not explosive_tickers:
              print("No explosive stocks to score")
              sys.exit(0)

          # INCREMENTAL: score only the trigger-selected subset unless this is a full
          # re-score (scorer change / 14-day ceiling / manual force). explosive_tickers
          # (the full current set) is still stored for change-detection bookkeeping.
          import os as _os
          _force = _os.environ.get('FORCE_IM3', '') == 'true'
          # v-fix SELF-HEAL: if the majority of this run's scoring universe has NO entry in the
          # im3_detail store (the modal's per-metric data), the store was gutted (the prune incident)
          # -- auto-trigger a FULL re-score to rebuild it. No checkbox, no human step. One-shot:
          # once the store is populated this condition goes false and runs stay incremental.
          _det_now = data.get('im3_detail') or {}
          _backfill = sum(1 for _t in explosive_tickers if _t not in _det_now) > (len(explosive_tickers) // 2)
          if _backfill:
              print(f"[im3 self-heal] detail store missing for majority of {len(explosive_tickers)} tickers -- forcing FULL re-score")
          _full = _force or _backfill or _os.environ.get('FULL_RESCORE', '') == 'true'
          _sel = [t for t in _os.environ.get('SCORE_TICKERS', '').split() if t]
          score_list = explosive_tickers if (_full or not _sel) else [t for t in _sel if t in explosive_tickers]
          if not score_list:
              score_list = explosive_tickers
          print(f"Scoring {len(score_list)} of {len(explosive_tickers)} "
                f"({'FULL re-score' if _full or score_list == explosive_tickers else 'incremental'}): {score_list}")

          # ROOT-CAUSE FIX (owner-audited): the single-shot subprocess was sized for '~60 tickers
          # ~= 15 min', but the consensus-source expansion (Banks-tab/Narrative-tab/Sector-Booming/
          # whale smart lists all feed this union) grew the FULL-path list to 300+. Since ~Jul 30
          # every full attempt died in one shot -- one bad ticker or one malformed byte anywhere
          # meant ZERO scores, a silent green soft-exit (sys.exit(0)) BEFORE the row stamps and
          # im3_last_scored_utc, and nothing recorded where it could be seen. That silent death is
          # what left the modal's interiors unrecoverable after the im3_detail relocation.
          # FIX: score in CHUNKS of 40 with per-chunk parse + per-chunk failure capture. A poison
          # chunk now loses at most 40 names instead of all of them; everything that succeeds gets
          # stamped and relocated normally; every failed chunk is recorded into data.json
          # meta.warnings (self-serve diagnosable -- no more invisible step-summary-only deaths).
          _chunks = [score_list[i:i+40] for i in range(0, len(score_list), 40)]
          _all_scores = []
          _chunk_fails = []
          for _ci, _ch in enumerate(_chunks):
              try:
                  _res = subprocess.run(
                      [sys.executable, 'im3_score.py', '--json'] + _ch,
                      capture_output=True, text=True, timeout=1800)
              except subprocess.TimeoutExpired:
                  _chunk_fails.append({'chunk': _ci, 'n': len(_ch), 'tickers': _ch[:8],
                                       'reason': 'timeout_1800s'})
                  continue
              if _res.stderr:
                  print(f"STDERR chunk {_ci}:", _res.stderr[:300])
              _raw = (_res.stdout or '').strip()
              _js = _raw.find('[')
              if _js > 0: _raw = _raw[_js:]
              try:
                  _sc = json.loads(_raw)
                  if isinstance(_sc, list): _all_scores.extend(_sc)
                  else: raise ValueError('non-list JSON')
              except Exception as _pe:
                  _chunk_fails.append({'chunk': _ci, 'n': len(_ch), 'tickers': _ch[:8],
                                       'reason': 'parse:%s' % type(_pe).__name__,
                                       'rc': _res.returncode, 'head': (_res.stdout or '')[:160],
                                       'stderr_head': (_res.stderr or '')[:160]})
          if _chunk_fails:
              _fmsg = 'IM3 chunks failed: %d/%d -- %s' % (len(_chunk_fails), len(_chunks),
                       '; '.join('c%s(%s):%s' % (f['chunk'], f['n'], f['reason']) for f in _chunk_fails))
              print(f"::warning title=IM3 chunk failures::{_fmsg}")
              try:
                  data['meta'].setdefault('warnings', []).append('[im3 chunks] ' + _fmsg)
                  data['im3_chunk_fails'] = _chunk_fails
              except Exception: pass
          else:
              data.pop('im3_chunk_fails', None)
          print(f"[im3 chunked] {len(_all_scores)} scores from {len(_chunks)-len(_chunk_fails)}/{len(_chunks)} chunks")
          class _R: pass
          result = _R(); result.returncode = 0 if _all_scores else 1
          result.stdout = json.dumps(_all_scores); result.stderr = ''

          # stdout should be pure JSON; stderr has any debug output
          if result.stderr:
              print("STDERR:", result.stderr[:500])
          if result.returncode != 0:
              import os
              _msg = f"im3_score.py exited with code {result.returncode}. Keeping last-good IM3 scores."
              print(f"::warning title=IM3 scoring nonzero exit::{_msg}")
              _sf = os.environ.get('GITHUB_STEP_SUMMARY')
              if _sf:
                  with open(_sf, 'a') as _s:
                      _s.write(f"\n### ⚠️ IM3 scoring nonzero exit\n{_msg}\n")

          # Find JSON in output - look for the [ that starts the array
          raw = result.stdout.strip()
          json_start = raw.find('[')
          if json_start > 0:
              raw = raw[json_start:]  # Strip any non-JSON prefix

          # Parse JSON output
          try:
              scores = json.loads(raw)
          except json.JSONDecodeError as e:
              # Surface the failure in the Actions UI instead of passing as clean green.
              msg = f"IM3 scoring FAILED to parse output: {e}. Keeping last-good IM3 scores."
              print(f"::warning title=IM3 scoring failed::{msg}")
              import os
              _sf = os.environ.get('GITHUB_STEP_SUMMARY')
              if _sf:
                  with open(_sf, 'a') as _s:
                      _s.write(f"\n### ⚠️ IM3 scoring failed\n{msg}\n\nOutput head: `{result.stdout[:200]}`\n")
              print("Output was:", result.stdout[:200])
              sys.exit(0)  # Soft-exit so the dashboard still deploys, but the warning above flags it.

          # Map scores by ticker; SURFACE per-ticker errors instead of silently dropping
          # them (the dropped {'ticker','error'} records were the only diagnostic for names
          # like ABCL/GAU that raise inside score_ticker on the runner — printed here + in
          # the Actions step summary so the exact cause is visible on the next run).
          import os
          score_map = {s['ticker']: s for s in scores if 'error' not in s}
          error_map = {s['ticker']: s.get('error') for s in scores if 'error' in s}
          print(f"Successfully scored: {list(score_map.keys())}")
          if error_map:
              print(f"IM3 per-ticker errors ({len(error_map)}): "
                    + "; ".join(f"{t}: {e}" for t, e in error_map.items()))
              _sf = os.environ.get('GITHUB_STEP_SUMMARY')
              if _sf:
                  with open(_sf, 'a') as _s:
                      _s.write("\n### ⚠️ IM3 per-ticker errors\n"
                               + "\n".join(f"- **{t}** — {e}" for t, e in error_map.items())
                               + "\n")

          # Write scores back into explosive_us AND tce_us records
          for record in data.get('explosive_us', []):
              tk = record['ticker']
              if tk in score_map:
                  record['im3'] = score_map[tk]
          for record in data.get('tce_us', []):
              tk = record['ticker']
              if tk in score_map:
                  record['im3'] = score_map[tk]
          # ZACKS DISCOVERY pink-tier rows receive their scores as well
          for record in (data.get('zacks_radar') or {}).get('rows', []):
              tk = record.get('ticker')
              if tk in score_map:
                  record['im3'] = score_map[tk]

          # v1.300 SMART-MONEY GRADES LAND (owner-audited gap): the whale + consensus names
          # WERE being scored (universe 205 -> 259) but the merge wrote only into
          # explosive_us / tce_us / zacks_radar. AMZN, AAPL, MSFT and GOOG live in none of
          # those arrays, so their grades were computed and silently discarded -- a search of
          # the whole data.json found no im3 block for them. Give the grades somewhere to land.
          # v1.300.1 FIX (post-deploy audit): the first version stamped from score_map ONLY,
          # which holds just the names re-scored THIS run. Runs are incremental (48 of 261),
          # so carried grades were invisible here -- NVDA/META/AVGO/MU read 'PENDING' on the
          # consensus box while showing A/A/A/B on the Explosive tab. Build a COMPLETE lookup:
          # this run's score_map PLUS every grade already living in the scored record arrays.
          # v1.300.2: a PERSISTENT grade book. Consensus/whale blocks are REBUILT by the
          # scanner every run, so a grade stamped into them yesterday is gone today -- MSFT and
          # GOOG proved it (graded once, then blank because no record array holds them). The
          # book accumulates every grade ever computed and rides data.json, so any rebuilt
          # block can be re-stamped on any later run without re-scoring.
          _grade_all = dict(data.get('im3_grade_book') or {})
          _grade_all.update(score_map)
          for _src in (data.get('explosive_us') or [], data.get('tce_us') or [],
                       ((data.get('zacks_radar') or {}).get('rows') or []),
                       data.get('explosive_psx') or [], data.get('tce_psx') or []):
              for _r in _src:
                  if not isinstance(_r, dict):
                      continue
                  _t = _r.get('ticker')
                  _im = _r.get('im3')
                  if _t and isinstance(_im, dict) and _im.get('grade'):
                      _grade_all[_t] = _im          # freshest record wins over the book
          _sm_hit = 0
          # data.json trim step 1 (D-105, one payload per version): these merge targets are
          # DISPLAY-ONLY chips -- the index reads exactly im3.grade / .pct / .name /
          # .valuation.label off them (full consumer census 2026-08-03; top_holdings has ZERO
          # index consumers and exists for the workflow's own smart-list building). Stamping
          # the FULL grade record (metrics + metric_values + valuation detail + iv, ~6 KB each)
          # into ~280 such entries was ~1 MB of pure duplication -- the full records already
          # live on explosive_us/tce_us rows and in the grade book. Same principle as the
          # v1.300.3 SLIM BOOK above; a display chip needs a display-sized record.
          def _disp_slim(_g):
              try:
                  return {'ticker': _g.get('ticker'), 'name': _g.get('name'),
                          'grade': _g.get('grade'), 'pct': _g.get('pct'),
                          'valuation': ({'label': (_g.get('valuation') or {}).get('label')}
                                         if isinstance(_g.get('valuation'), dict) else None)}
              except Exception:
                  return {'grade': (_g or {}).get('grade')}
          for record in ((data.get('inst_consensus') or {}).get('stocks') or []):
              tk = record.get('ticker')
              if tk in _grade_all:
                  record['im3'] = _disp_slim(_grade_all[tk]); _sm_hit += 1
          for _wh in ((data.get('whale_13f') or {}).get('whales') or []):
              for _lst in ('top_holdings', 'new_buys', 'adds', 'exits'):
                  for record in (_wh.get(_lst) or []):
                      tk = record.get('ticker')
                      if tk in _grade_all:
                          record['im3'] = _disp_slim(_grade_all[tk]); _sm_hit += 1
          # v1.300.3 SLIM BOOK (owner-approved): the book was the single biggest key in
          # data.json (1.81 MB) and HALF of it was the per-metric breakdown, duplicated from
          # records that already carry it. Re-stamping a rebuilt block only needs the summary,
          # so the book stores grade/pct/score/max/ver (+valuation flag) -- ~0.9 MB saved.
          _BOOK_KEEP = ('grade', 'pct', 'score', 'max', 'ver', 'scan_rev', 'stale_ver',
                        'bank_model', 'valuation', 'iv', 'as_of')
          def _slim_grade(_g):
              _o = {_k: _v for _k, _v in _g.items() if _k in _BOOK_KEEP}
              _v2 = _o.get('valuation')
              if isinstance(_v2, dict):        # keep the Val chip summary, drop its metric list
                  _o['valuation'] = {_k2: _v3 for _k2, _v3 in _v2.items() if _k2 != 'metrics'}
              return _o
          # v1.302.1 (post-deploy audit): build_ep_signal runs INSIDE the scanner, i.e. BEFORE
          # this scoring step, so its E&P chips carried None even though XOM/CVX/COP/EOG are
          # graded. Same run-order class as the Wave-Z bug. Re-stamp here, where every grade
          # is known, so the Tab-7 action banner always shows the quality of what it tells the
          # owner to overweight.
          _ep = data.get('ep_signal')
          if isinstance(_ep, dict) and _ep.get('names'):
              _ep['grades'] = {_t: (_grade_all.get(_t) or {}).get('grade') for _t in _ep['names']}
              print('ep_signal grades re-stamped: ' + str(_ep['grades']))

          data['im3_grade_book'] = {
              _t: _slim_grade(_g)
              for _t, _g in _grade_all.items() if isinstance(_g, dict) and _g.get('grade')
          }
          print(f'smart-money grades attached to {_sm_hit} consensus/whale record(s) '
                f'from {len(_grade_all)} known grades ({len(score_map)} scored this run)')

          # v1.277.2 pair: PERSIST per-ticker scoring errors into data.json -- the owner's audit
          # showed the exact exception messages existed only in this step's summary, unreachable
          # for self-diagnosis. Now every failure's message rides in data['im3_errors'] (and clears
          # itself once a name scores successfully).
          from datetime import datetime as _dt2, timezone as _tz2
          data['im3_errors'] = {'as_of': _dt2.now(_tz2.utc).isoformat(),
                                'errors': error_map}

          # Store ticker list for change detection next run
          data['im3_explosive_tickers'] = explosive_tickers
          # P4: stamp the 14-day staleness clock ONLY on FULL re-scores -- an incremental
          # top-up must not reset the ceiling, or full-set freshness would never re-fire.
          from datetime import datetime, timezone
          # v2 instrumentation (owner-approved): the 14-day clock stamped on runs that looked
          # incremental -- name the exact reason every run so the next occurrence self-explains.
          _stamp_reason = ('force' if _force else
                           ('full: ' + (_os.environ.get('FULL_REASON') or 'flag')) if _os.environ.get('FULL_RESCORE','') == 'true' else
                           'empty-selection fallback' if not _sel else
                           'selection==full set' if score_list == explosive_tickers else
                           None)
          print(f"[stamp check] force={_force} FULL_RESCORE='{_os.environ.get('FULL_RESCORE','')}' "
                f"sel={len(_sel)} scored={len(score_list)} full_set={len(explosive_tickers)} "
                f"-> {'STAMPING (' + _stamp_reason + ')' if _stamp_reason else 'incremental, clock untouched'}")
          # v1.283.0 pair (owner-approved): the stamp reason rides data.json -- the print above
          # lands in the 403-walled Actions log where Claude cannot read it.
          data['im3_stamp_reason'] = {'as_of': datetime.now(timezone.utc).isoformat(),
                                      'reason': _stamp_reason or 'incremental -- clock untouched',
                                      'scored': len(score_list), 'full_set': len(explosive_tickers)}
          if _stamp_reason:
              data['im3_last_scored_utc'] = datetime.now(timezone.utc).isoformat()

          # data.json trim step 2b (D-105): valuation.metrics dedup. Every full im3 blob's
          # valuation sub-dict carries a 10-entry metrics list that DUPLICATES entries already
          # present in the main metrics list (bucket=='valuation'). Consumer census: the detail
          # modal reads valuation.pct/.label/.score/.max only; Tab-19/tracker chips read .label;
          # NOTHING reads valuation.metrics (192 KB payload-wide at audit). The book already
          # strips it (_slim_grade); this sweep makes the six row arrays converge in ONE run,
          # covering rows carried from before this fix. Idempotent, display-null.
          # trim step 3 (D-105): im3_detail dedup -- metrics+metric_values relocate OUT of every row's
          # im3 into ONE per-ticker store (measured: 357 stamps for 256 unique tickers, 1,307 KB duplicated
          # down to ~1,003 KB stored once = ~304 KB net). The modal (the interiors' only consumer) merges
          # them back client-side via _im3Full (index v5.300). Shared-object stamps (the PSX trio stamps
          # the SAME smap dict into 3 arrays) dedupe naturally: the first pop stores, later arrays see it
          # already relocated. Idempotent; chip fields (grade/pct/valuation summary/iv/explosive) stay on rows.
          _det_vm = data.setdefault('im3_detail', {})
          _seen_vm = set()
          for _arr_vm in (data.get('explosive_us') or [], data.get('tce_us') or [],
                          ((data.get('zacks_radar') or {}).get('rows') or []),
                          data.get('explosive_psx') or [], data.get('tce_psx') or [],
                          data.get('psx_candidates') or []):
              for _r_vm in _arr_vm:
                  _im_vm = _r_vm.get('im3') if isinstance(_r_vm, dict) else None
                  if isinstance(_im_vm, dict):
                      _v_vm = _im_vm.get('valuation')
                      if isinstance(_v_vm, dict):
                          _v_vm.pop('metrics', None)
                      # v-fix: key by the ROW ticker -- that is what the index's _im3Full looks up.
                      # (im3.ticker is 'PSX:AHL' for PSX names while rows carry bare 'AHL'; keying by
                      # im3.ticker made every stored PSX entry unreachable client-side.)
                      _tk_vm = (_r_vm.get('ticker') if isinstance(_r_vm, dict) else None) or _im_vm.get('ticker')
                      if _tk_vm:
                          _seen_vm.add(_tk_vm)
                          _mm_vm = _im_vm.pop('metrics', None)
                          _mv_vm = _im_vm.pop('metric_values', None)
                          if _mm_vm or _mv_vm:
                              _det_vm[_tk_vm] = {'metrics': _mm_vm, 'metric_values': _mv_vm}
          # Write updated data.json
          with open('data.json', 'w') as f:
              json.dump(data, f, separators=(',',':'), default=str)

          print(f"data.json updated with IM3 scores for {len(score_map)} stocks")

          # Stamp the scorer version so the next run only re-scores on a real change.
          # v1.283.1: the hash rides data.json (durable); the loose file is legacy fallback.
          import hashlib
          try:
              _wh = hashlib.sha256()
              _wh.update(open('im3_score.py','rb').read())
              for _bf in ('bank_ig2_inputs.json',):
                  try: _wh.update(open(_bf,'rb').read())
                  except Exception: pass
              data['im3_scorer_hash'] = _wh.hexdigest()
              with open('data.json', 'w') as _f2:
                  json.dump(data, _f2, separators=(',',':'), default=str)
              open('.im3_scorer_hash','w').write(_wh.hexdigest())
              print('Updated im3_scorer_hash (data.json + legacy file)')
          except Exception as _e:
              print('scorer hash write failed:', _e)
          EOF

      - name: Update explosive ticker list (no change)
        if: steps.check_explosive.outputs.changed == 'false' && github.event.inputs.force_im3 != 'true'
        run: |
          python3 << 'EOF'
          import json
          print("Explosive list unchanged — keeping existing IM3 scores")
          # Preserve existing im3 scores from previous data.json
          # (scanner already loaded EXISTING data, so scores are intact)
          EOF

      - name: Score PSX stocks with IM3 (reduced / System B)
        # ADDITIVE — does not touch the US IM3 steps above. Scores the 5 holdings + the live
        # PSX screen via im3_score.py with the "PSX:" prefix (TV pakistan/scan single-period,
        # empty history, reduced denominator, PKR risk-free). Self-gates: re-scores only when
        # the PSX set changes, the scorer changes, a score is missing, or force_im3 is set, so
        # identical runs don't churn data.json. Writes scores into explosive_psx / tce_psx /
        # psx_candidates so the dashboard's PSX IM3 column picks them up.
        env:
          FORCE_IM3: ${{ github.event.inputs.force_im3 }}
        run: |
          python3 << 'EOF'
          import json, subprocess, sys, os, hashlib

          with open('data.json') as f:
              data = json.load(f)

          HOLDINGS = ['OGDC', 'PPL', 'MCB', 'FFC', 'HUBC']
          psx_syms = sorted(set(HOLDINGS + [r['ticker'] for r in data.get('psx_candidates', []) if r.get('ticker')]))
          if not psx_syms:
              print("No PSX names to score"); sys.exit(0)

          # --- self-gate: only re-score on a real change ---
          prev = sorted(data.get('im3_psx_tickers', []))
          set_changed = psx_syms != prev

          def _has_im3(records, tk):
              for r in records:
                  if r.get('ticker') == tk:
                      v = r.get('im3'); return isinstance(v, dict) and len(v) > 0
              return False
          missing = [t for t in psx_syms
                     if not (_has_im3(data.get('psx_candidates', []), t) or _has_im3(data.get('explosive_psx', []), t))]

          # Hash BOTH the scorer AND the broker-financials file, so adding/editing a name's
          # multi-year statements in psx_financials.json triggers a re-score on the next run
          # (without it, a financials-only edit would be carried-forward as "unchanged").
          try:
              _h = hashlib.sha256()
              _h.update(open('im3_score.py', 'rb').read())
              try: _h.update(open('psx_financials.json', 'rb').read())
              except Exception: pass
              for _bf in ('bank_ig2_inputs.json', 'bank_ig2_overrides.json'):
                  try: _h.update(open(_bf, 'rb').read())
                  except Exception: pass
              cur_hash = _h.hexdigest()
          except Exception: cur_hash = ''
          try:    prev_hash = open('.im3_psx_hash').read().strip()
          except Exception: prev_hash = ''
          inputs_changed = bool(cur_hash) and cur_hash != prev_hash
          forced = str(os.environ.get('FORCE_IM3', '')).lower() == 'true'

          # Version trigger: re-score whenever the scorer's stamped version differs from the
          # version already in data.json. Unlike the hash gate (which writes its hash even on a
          # skip and can get "stuck"), this reliably fires once after any im3_score.py deploy,
          # so a scorer change auto-re-scores on the next run with NO manual force_im3.
          try:
              _vl = next((l for l in open('im3_score.py') if l.strip().startswith('IM3_VERSION')), '')
              cur_ver = _vl.split('=', 1)[1].strip().strip('"\'') if _vl else ''
          except Exception:
              cur_ver = ''
          def _im3_ver(records):
              for r in records:
                  v = r.get('im3')
                  if isinstance(v, dict) and v.get('ver'):
                      return v.get('ver')
              return None
          data_ver = _im3_ver(data.get('psx_candidates', [])) or _im3_ver(data.get('explosive_psx', []))
          ver_changed = bool(cur_ver) and cur_ver != data_ver

          if not (set_changed or missing or inputs_changed or ver_changed or forced):
              print(f"PSX IM3 unchanged ({len(psx_syms)} names) — keeping last-good")
              try: open('.im3_psx_hash', 'w').write(cur_hash)
              except Exception: pass
              sys.exit(0)

          print(f"Scoring {len(psx_syms)} PSX names (set_changed={set_changed} missing={len(missing)} inputs_changed={inputs_changed} ver_changed={ver_changed} forced={forced})")
          tickers = ['PSX:' + s for s in psx_syms]
          result = subprocess.run([sys.executable, 'im3_score.py', '--json'] + tickers,
                                  capture_output=True, text=True, timeout=900)
          if result.stderr: print("STDERR:", result.stderr[:500])

          raw = result.stdout.strip()
          js = raw.find('[')
          if js > 0: raw = raw[js:]
          try:
              scores = json.loads(raw)
          except Exception as e:
              print(f"::warning title=PSX IM3 parse failed::{e}. Keeping last-good PSX scores.")
              print("Output head:", result.stdout[:200]); sys.exit(0)

          smap = {s['ticker'].split(':')[-1]: s for s in scores
                  if 'error' not in s and str(s.get('ticker', '')).startswith('PSX:')}
          emap = {s['ticker'].split(':')[-1]: s.get('error') for s in scores
                  if 'error' in s and str(s.get('ticker', '')).startswith('PSX:')}
          print(f"PSX scored: {sorted(smap.keys())}")
          if emap:
              print(f"PSX IM3 per-ticker errors ({len(emap)}): "
                    + "; ".join(f"{t}: {e}" for t, e in emap.items()))
              _sf = os.environ.get('GITHUB_STEP_SUMMARY')
              if _sf:
                  with open(_sf, 'a') as _s:
                      _s.write("\n### ⚠️ PSX IM3 per-ticker errors\n"
                               + "\n".join(f"- **{t}** — {e}" for t, e in emap.items()) + "\n")

          for key in ('explosive_psx', 'tce_psx', 'psx_candidates'):
              for rec in data.get(key, []):
                  if rec.get('ticker') in smap:
                      sc = smap[rec['ticker']]
                      rec['im3'] = sc
                      # Finalise the PSX explosive verdict from IM3's statement-derived
                      # canonical conditions (same G1/G2/A1/A2/C1/C3 as the US screen, fed
                      # real operating/net/cash growth — no eps/rev proxy). Only the
                      # PARTIAL (pending) rows are finalised; a true-bank carve-out stands.
                      if key == 'explosive_psx' \
                         and str(rec.get('verdict', '')).startswith('PARTIAL') \
                         and isinstance(sc.get('explosive'), dict):
                          exp = sc['explosive']
                          for _f in ('verdict', 'rev_growth', 'op_growth', 'np_growth',
                                     'pbt_growth', 'op_np_ratio', 'signal_a', 'signal_b',
                                     'conditions'):
                              if _f in exp:
                                  rec[_f] = exp[_f]

          # data.json trim step 2b (D-105): valuation.metrics dedup. Every full im3 blob's
          # valuation sub-dict carries a 10-entry metrics list that DUPLICATES entries already
          # present in the main metrics list (bucket=='valuation'). Consumer census: the detail
          # modal reads valuation.pct/.label/.score/.max only; Tab-19/tracker chips read .label;
          # NOTHING reads valuation.metrics (192 KB payload-wide at audit). The book already
          # strips it (_slim_grade); this sweep makes the six row arrays converge in ONE run,
          # covering rows carried from before this fix. Idempotent, display-null.
          # trim step 3 (D-105): im3_detail dedup -- metrics+metric_values relocate OUT of every row's
          # im3 into ONE per-ticker store (measured: 357 stamps for 256 unique tickers, 1,307 KB duplicated
          # down to ~1,003 KB stored once = ~304 KB net). The modal (the interiors' only consumer) merges
          # them back client-side via _im3Full (index v5.300). Shared-object stamps (the PSX trio stamps
          # the SAME smap dict into 3 arrays) dedupe naturally: the first pop stores, later arrays see it
          # already relocated. Idempotent; chip fields (grade/pct/valuation summary/iv/explosive) stay on rows.
          _det_vm = data.setdefault('im3_detail', {})
          _seen_vm = set()
          for _arr_vm in (data.get('explosive_us') or [], data.get('tce_us') or [],
                          ((data.get('zacks_radar') or {}).get('rows') or []),
                          data.get('explosive_psx') or [], data.get('tce_psx') or [],
                          data.get('psx_candidates') or []):
              for _r_vm in _arr_vm:
                  _im_vm = _r_vm.get('im3') if isinstance(_r_vm, dict) else None
                  if isinstance(_im_vm, dict):
                      _v_vm = _im_vm.get('valuation')
                      if isinstance(_v_vm, dict):
                          _v_vm.pop('metrics', None)
                      # v-fix: key by the ROW ticker -- that is what the index's _im3Full looks up.
                      # (im3.ticker is 'PSX:AHL' for PSX names while rows carry bare 'AHL'; keying by
                      # im3.ticker made every stored PSX entry unreachable client-side.)
                      _tk_vm = (_r_vm.get('ticker') if isinstance(_r_vm, dict) else None) or _im_vm.get('ticker')
                      if _tk_vm:
                          _seen_vm.add(_tk_vm)
                          _mm_vm = _im_vm.pop('metrics', None)
                          _mv_vm = _im_vm.pop('metric_values', None)
                          if _mm_vm or _mv_vm:
                              _det_vm[_tk_vm] = {'metrics': _mm_vm, 'metric_values': _mv_vm}
          # v-fix: PRUNE REMOVED. Live evidence: the first production run's prune deleted every US entry
          # from im3_detail (the store held only 48 PSX:-prefixed keys), stripping the detail modal's
          # data for all US names. Stale keys cost a few KB and self-clear as tickers re-score; a prune
          # that can destroy modal data has no place here. One-time migration: re-key any legacy
          # 'PSX:X'-form entries to the bare row-ticker form the index actually looks up.
          for _k_vm in list(_det_vm.keys()):
              if isinstance(_k_vm, str) and ':' in _k_vm:
                  _bare_vm = _k_vm.split(':', 1)[1]
                  if _bare_vm and _bare_vm not in _det_vm:
                      _det_vm[_bare_vm] = _det_vm.pop(_k_vm)
                  else:
                      _det_vm.pop(_k_vm)
          data['im3_psx_tickers'] = psx_syms
          with open('data.json', 'w') as f:
              json.dump(data, f, separators=(',',':'), default=str)
          try: open('.im3_psx_hash', 'w').write(cur_hash)
          except Exception: pass
          print(f"data.json updated with PSX IM3 for {len(smap)} names")
          EOF

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json .im3_scorer_hash .scanner_inputs_hash
          [ -f .im3_psx_hash ] && git add .im3_psx_hash || true
          [ -f psx_history_cache.json ] && git add psx_history_cache.json || true
          [ -f us_history_cache.json ] && git add us_history_cache.json || true
          git diff --quiet --cached || git commit -m "Scan run"
          # Concurrent-run hardening. data.json is FULLY regenerated each run, so when two runs
          # overlap (manual + scheduled, or back-to-back forced runs), the loser's push is rejected
          # and a plain rebase hits an unresolvable data.json conflict (two different whole-file
          # rewrites — git can't line-merge them) and aborts with exit 1. Retry loop: try push; on
          # rejection, fetch latest main and rebase our scan commit on top, resolving any conflict in
          # favour of OUR freshly-generated files (`-X theirs` == the commit being replayed during a
          # rebase, i.e. ours). Non-conflicting files from the other commit merge normally and are
          # preserved. Up to 5 attempts with linear backoff. The freshest scan's data.json wins.
          export GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true
          pushed=""
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=1; echo "pushed on attempt $i"; break; fi
            echo "push rejected (attempt $i) — rebasing scan commit onto latest main"
            git fetch origin main
            git rebase -X theirs origin/main || { echo "rebase failed; aborting and retrying"; git rebase --abort || true; }
            sleep $((i * 4))
          done
          [ -n "$pushed" ] || { echo "::error title=Scan push failed::could not push after 5 attempts (persistent concurrent writes)"; exit 1; }
