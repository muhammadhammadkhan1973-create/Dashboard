name: Daily Dashboard Scan

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 Dubai (UTC+4)
    - cron: '0 14 * * *'  # 18:00 Dubai (UTC+4)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-scan        # only one scan run at a time; queued runs wait, none cancelled
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance pandas feedparser python-dateutil fredapi openpyxl

      - name: Run scanner
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scanner.py

      - name: Check if explosive list changed
        id: check_explosive
        run: |
          python3 << 'EOF'
          import json, os

          # Read new explosive list from data.json
          with open('data.json') as f:
              data = json.load(f)

          # Explosive both-signal tickers
          explosive = sorted([
              r['ticker'] for r in data.get('explosive_us', [])
              if r.get('verdict', '').startswith('EXPLOSIVE')
          ])
          # TCE HIGH tickers (US only)
          tce_high = sorted([
              r['ticker'] for r in data.get('tce_us', [])
              if r.get('tier') == 'HIGH'
          ])
          # Combined — score both
          new_tickers = sorted(set(explosive + tce_high))

          # Read previous list (stored in data.json from last run)
          prev_tickers = sorted(data.get('im3_explosive_tickers', []))

          changed = new_tickers != prev_tickers
          print(f"Previous: {prev_tickers}")
          print(f"New:      {new_tickers}")
          print(f"Changed:  {changed}")

          # Write output for next step
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
              f.write(f"tickers={' '.join(new_tickers)}\n")
          EOF

      - name: Score explosive stocks with IM3
        if: steps.check_explosive.outputs.changed == 'true'
        run: |
          python3 << 'EOF'
          import json, subprocess, sys

          with open('data.json') as f:
              data = json.load(f)

          # Explosive both-signal tickers
          explosive = [
              r['ticker'] for r in data.get('explosive_us', [])
              if r.get('verdict', '').startswith('EXPLOSIVE')
          ]
          # TCE HIGH tickers (US only)
          tce_high = [
              r['ticker'] for r in data.get('tce_us', [])
              if r.get('tier') == 'HIGH'
          ]
          explosive_tickers = sorted(set(explosive + tce_high))

          if not explosive_tickers:
              print("No explosive stocks to score")
              sys.exit(0)

          print(f"Scoring {len(explosive_tickers)} explosive stocks: {explosive_tickers}")

          # Run im3_score.py with --json flag
          result = subprocess.run(
              [sys.executable, 'im3_score.py', '--json'] + explosive_tickers,
              capture_output=True, text=True, timeout=600
          )

          # stdout should be pure JSON; stderr has any debug output
          if result.stderr:
              print("STDERR:", result.stderr[:500])
          if result.returncode != 0:
              import os
              _msg = f"im3_score.py exited with code {result.returncode}. Keeping last-good IM3 scores."
              print(f"::warning title=IM3 scoring nonzero exit::{_msg}")
              _sf = os.environ.get('GITHUB_STEP_SUMMARY')
              if _sf:
                  with open(_sf, 'a') as _s:
                      _s.write(f"\n### ⚠️ IM3 scoring nonzero exit\n{_msg}\n")

          # Find JSON in output - look for the [ that starts the array
          raw = result.stdout.strip()
          json_start = raw.find('[')
          if json_start > 0:
              raw = raw[json_start:]  # Strip any non-JSON prefix

          # Parse JSON output
          try:
              scores = json.loads(raw)
          except json.JSONDecodeError as e:
              # Surface the failure in the Actions UI instead of passing as clean green.
              msg = f"IM3 scoring FAILED to parse output: {e}. Keeping last-good IM3 scores."
              print(f"::warning title=IM3 scoring failed::{msg}")
              import os
              _sf = os.environ.get('GITHUB_STEP_SUMMARY')
              if _sf:
                  with open(_sf, 'a') as _s:
                      _s.write(f"\n### ⚠️ IM3 scoring failed\n{msg}\n\nOutput head: `{result.stdout[:200]}`\n")
              print("Output was:", result.stdout[:200])
              sys.exit(0)  # Soft-exit so the dashboard still deploys, but the warning above flags it.

          # Map scores by ticker
          score_map = {s['ticker']: s for s in scores if 'error' not in s}
          print(f"Successfully scored: {list(score_map.keys())}")

          # Write scores back into explosive_us AND tce_us records
          for record in data.get('explosive_us', []):
              tk = record['ticker']
              if tk in score_map:
                  record['im3'] = score_map[tk]
          for record in data.get('tce_us', []):
              tk = record['ticker']
              if tk in score_map:
                  record['im3'] = score_map[tk]

          # Store ticker list for change detection next run
          data['im3_explosive_tickers'] = explosive_tickers

          # Write updated data.json
          with open('data.json', 'w') as f:
              json.dump(data, f, indent=2, default=str)

          print(f"data.json updated with IM3 scores for {len(score_map)} stocks")
          EOF

      - name: Update explosive ticker list (no change)
        if: steps.check_explosive.outputs.changed == 'false'
        run: |
          python3 << 'EOF'
          import json
          print("Explosive list unchanged — keeping existing IM3 scores")
          # Preserve existing im3 scores from previous data.json
          # (scanner already loaded EXISTING data, so scores are intact)
          EOF

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data.json /tmp/scan-data.json          # our fresh scan output (incl. IM3 scores)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main             # re-base onto the latest main
            cp /tmp/scan-data.json data.json         # our data.json always wins (only the bot writes it)
            git add data.json
            git diff --quiet --cached && { echo "data.json unchanged vs latest main"; exit 0; }
            git commit -m "Scan run"
            if git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            echo "push race lost, retrying ($i/5)"; sleep $((RANDOM % 5 + 3))
          done
          echo "push failed after 5 attempts"; exit 1
