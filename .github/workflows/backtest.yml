name: TCE Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run backtest
        run: python tce_backtest.py

      - name: Upload results CSV
        uses: actions/upload-artifact@v4
        with:
          name: tce-backtest-results
          path: tce_backtest_results.csv
