name: IM3 Source Probe

# One-off, manual. Actions tab -> "IM3 Source Probe" -> Run workflow -> read the log.
# Logging only: confirms TV + FMP field names for MU. Writes nothing, commits nothing.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run IM3 source probe
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python im3_source_probe.py
