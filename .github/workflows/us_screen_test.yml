name: US screen parallel test
on:
  workflow_dispatch:
jobs:
  parallel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests yfinance pandas numpy
      - run: python us_tv_screen.py
